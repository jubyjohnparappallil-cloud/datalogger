<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Logger Data Separator</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f7f5;
      font-family: "Segoe UI", Calibri, Arial, sans-serif;
      color: #1f2933;
    }
    form {
      background: #fff;
      border: 1px solid #d9e2ec;
      border-radius: 10px;
      padding: 28px;
      width: 330px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 19px;
      color: #185c37;
    }
    p {
      margin: 0 0 18px;
      font-size: 13px;
      color: #5b6770;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid #c5d0d8;
      border-radius: 7px;
      font-size: 14px;
    }
    button {
      width: 100%;
      margin-top: 12px;
      background: #217346;
      color: #fff;
      border: 0;
      border-radius: 7px;
      padding: 11px;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
    }
    .error {
      margin-top: 12px;
      font-size: 13px;
      color: #9b1c1c;
    }
  </style>
</head>
<body>
  <form method="post">
    <h1>Logger Data Separator</h1>
    <p>Enter the password shared with your team.</p>
    <input type="password" name="password" placeholder="Password" autofocus required />
    <button type="submit">Sign in</button>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
  </form>
</body>
</html>
